<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro Estudiantil</title>
    <!-- Fuente moderna desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Encabezado con Ícono y Título -->
        <header class="app-header">
            <div class="logo-badge">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            </div>
            <h1>REGISTRO ESTUDIANTIL</h1>
            <p>Gestiona y exporta la información de tus alumnos de forma sencilla</p>
        </header>
        
        <!-- Formulario de Registro -->
        <form id="studentForm" class="card-form">
            <h2>Datos del Estudiante</h2>
            <div id="editBanner" class="edit-banner" style="display:none;">
                ✏️ Editando estudiante <strong id="editCodigo"></strong> — los cambios reemplazarán el registro existente.
            </div>
            
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Carlos López" required>
                </div>

                <div class="form-group">
                    <label for="nie">NIE</label>
                    <input type="text" id="nie" placeholder="12345678" required>
                </div>

                <div class="form-group">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" placeholder="16" min="1" max="100" required>
                </div>

                <div class="form-group">
                    <label for="grado">Grado</label>
                    <select id="grado" required>
                        <option value="" disabled selected>Seleccionar...</option>
                        <option value="1.er Desarrollo de Software">1.er Desarrollo de Software</option>
                        <option value="2.º Desarrollo de Software">2.º Desarrollo de Software</option>
                        <option value="3.er Desarrollo de Software">3.er Desarrollo de Software</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="seccion">Sección</label>
                    <select id="seccion" required>
                        <option value="" disabled selected>Seleccionar...</option>
                        <option value="A">Sección A</option>
                        <option value="B">Sección B</option>
                        <option value="C">Sección C</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="carlos@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" placeholder="70000000" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                    <span id="submitBtnText">REGISTRAR ESTUDIANTE</span>
                </button>
                <button type="button" id="cancelEditBtn" class="btn btn-cancel" style="display:none;">
                    ✕ CANCELAR EDICIÓN
                </button>
            </div>
        </form>

        <!-- Botones de Acción para Archivos -->
        <div class="actions-panel">
            <button id="downloadBtn" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                DESCARGAR ESTUDIANTES.TXT
            </button>
            <input type="file" id="fileInput" accept=".txt" style="display: none;">
            <button id="loadBtn" class="btn btn-outline">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                CARGAR ARCHIVO TXT
            </button>
        </div>

        <!-- Tabla de Resultados -->
        <div class="table-card">
            <h2>Estudiantes Registrados</h2>
            <div class="table-responsive">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>NIE</th>
                            <th>Edad</th>
                            <th>Grado</th>
                            <th>Sección</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Registros insertados dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
